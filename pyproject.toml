[build-system]
requires = ["setuptools>=70.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "optisar-net-plusplus"
version = "0.1.0"
description = "OptiSAR-Net++ for cross-domain remote sensing visual grounding"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0"}
authors = [
  {name = "Xiaoyu Tang"},
  {name = "Jun Dong"},
  {name = "Jintao Cheng"},
  {name = "Rui Fan"},
]
keywords = ["remote sensing", "visual grounding", "SAR", "mixture of experts"]
dependencies = [
  "einops>=0.7.0",
  "matplotlib>=3.7.0",
  "numpy>=1.23.0,<2.0.0",
  "opencv-python>=4.8.0",
  "pandas>=1.5.0",
  "pillow>=9.5.0",
  "psutil>=5.9.0",
  "py-cpuinfo>=9.0.0",
  "pyyaml>=6.0",
  "requests>=2.28.0",
  "scipy>=1.10.0",
  "seaborn>=0.12.0",
  "supervision>=0.25.1",
  "torch>=2.2.2,<2.3.0",
  "torchvision>=0.17.2,<0.18.0",
  "tqdm>=4.66.0",
  "ultralytics-thop>=2.0.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.6.0"]

[project.urls]
Repository = "https://github.com/JunDong-dev/OptiSAR-Net-PlusPlus"
Paper = "https://arxiv.org/abs/2603.24876"

[tool.setuptools]
packages = {find = {where = ["."], include = ["ultralytics", "ultralytics.*"]}}
package-data = {ultralytics = ["**/*.yaml"], "ultralytics.assets" = ["bus.jpg"]}

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
